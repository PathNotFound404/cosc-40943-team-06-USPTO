# Builds the macOS app (KD-packaging-pyinstaller, architecture section 7, step 2).
# A version tag on main (v1.0.0) publishes the DMG as a GitHub Release. Running the
# workflow by hand builds the DMG and keeps it as a workflow artifact, for testing.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - run: pip install -r requirements-build.txt

      - name: Check the tag matches the version
        if: github.ref_type == 'tag'
        run: |
          VERSION=$(python -c 'import re; print(re.search(r"__version__ = \"([^\"]+)\"", open("src/patent_intelligence/__init__.py").read()).group(1))')
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match __version__ $VERSION"
            exit 1
          fi

      - run: pytest
      - run: sh packaging/build_macos.sh

      - uses: actions/upload-artifact@v5
        with:
          name: macos-dmg
          path: dist/*.dmg
          if-no-files-found: error

      - name: Publish the GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/release-notes/${GITHUB_REF_NAME#v}.md"
          gh release create "$GITHUB_REF_NAME" dist/*.dmg --title "$GITHUB_REF_NAME" --notes-file "$NOTES"

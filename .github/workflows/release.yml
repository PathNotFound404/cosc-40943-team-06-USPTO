# Builds the macOS app and the Windows installer (KD-packaging-pyinstaller, architecture
# section 7, step 2). A version tag on main (v1.0.0) publishes the DMG and the installer as
# one GitHub Release. Running the workflow by hand, or a pull request that changes the
# packaging, builds both and keeps them as workflow artifacts, for testing.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - packaging/**
      - requirements*.txt
      - src/patent_intelligence/settings.py
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag matches the version
        run: |
          VERSION=$(python3 -c 'import re; print(re.search(r"__version__ = \"([^\"]+)\"", open("src/patent_intelligence/__init__.py").read()).group(1))')
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match __version__ $VERSION"
            exit 1
          fi

  build-macos:
    needs: check-version
    # Runs when check-version passed, or was skipped because this is not a tag.
    if: ${{ !failure() && !cancelled() }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - run: pip install -r requirements-build.txt
      - run: pytest
      - run: sh packaging/build_macos.sh
      - uses: actions/upload-artifact@v5
        with:
          name: macos-dmg
          path: dist/*.dmg
          if-no-files-found: error

  build-windows:
    needs: check-version
    if: ${{ !failure() && !cancelled() }}
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - run: pip install -r requirements-build.txt
      - run: pytest
      # Inno Setup 6 comes with the windows-2025 runner image, as hdiutil comes with macOS.
      - name: Show the Inno Setup version
        run: (Get-Item "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe").VersionInfo.ProductVersion
      - run: ./packaging/build_windows.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v5
        with:
          name: windows-installer
          path: dist/*-setup.exe
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/release-notes/${GITHUB_REF_NAME#v}.md"
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*-setup.exe --title "$GITHUB_REF_NAME" --notes-file "$NOTES"
